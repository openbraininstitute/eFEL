name: Build Wheels

on:
  pull_request: {}
  workflow_call:

permissions:
  contents: read

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python: [cp310, cp311, cp312, cp313, cp314]
        arch: [x86_64, amd64, arm64]
        exclude:
          - os: macos-14
            arch: amd64
          - os: macos-14
            arch: x86_64
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: windows-latest
            arch: arm64
    env:
      CIBW_BUILD: ${{ matrix.python }}*${{ matrix.arch }}
      CIBW_SKIP: "*-musllinux_*"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build-wheels-linux-aarch64:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [cp310, cp311, cp312, cp313, cp314]
    env:
      CIBW_BUILD: ${{ matrix.python }}*aarch64
      CIBW_SKIP: "*-musllinux_*"
      CIBW_ARCHS_LINUX: aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-aarch64-${{ matrix.python }}
          path: ./wheelhouse/*.whl
